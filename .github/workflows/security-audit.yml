name: Security & Hygiene

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/security-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/security-audit.yml"
  schedule:
    - cron: "0 3 * * 1"  # 毎週月曜 03:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit (RustSec CVE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Run cargo audit
        run: cargo audit --deny yanked

  package-integrity:
    name: Package integrity (publish される .crate が build できるか)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # publish される .crate に必要な file が全部入っているかを見る
      #
      # include_str! / include_bytes! が package 境界を越える、exclude を効かせ過ぎる、
      # 必要 file が漏れる — これらは repo / workspace に file がある限り
      # cargo build も cargo test も clippy も preflight も全部通り、
      # crates.io から取得した利用者だけが compile 不能になる
      # (2026-09-28 ALICE-LOL lol.gbnf、canonical template 罠 #51)
      #
      # semver-checks は baseline を build するので結果的に検出するが、
      # (a) 壊れた版を publish した後にしか分からない
      # (b) 未 publish crate は baseline が無く発火しない ので予防にならない
      - name: cargo package (.crate を作る)
        # --no-verify: 未 publish の sibling に path dep がある repo では verify step が
        #   registry 解決で落ちる 展開後の隔離 build が本体なので verify は不要
        run: cargo package --no-verify --allow-dirty

      - name: 展開して隔離 build (workspace は全 package 分)
        run: |
          set -euo pipefail
          found=0
          for crate in target/package/*.crate; do
            [ -e "$crate" ] || continue
            found=$((found + 1))
            echo "::group::$(basename "$crate") ($(du -h "$crate" | cut -f1))"
            tmp=$(mktemp -d)
            tar xzf "$crate" -C "$tmp"
            cd "$tmp"/*/
            # 親 workspace を継承すると member 扱いになり、境界を越えた file が
            # 再び見えてしまう (検査の意味が消える) ので単独 package として build
            printf '\n[workspace]\n' >> Cargo.toml
            cargo check --all-features
            cd - > /dev/null
            echo "::endgroup::"
          done
          [ "$found" -gt 0 ] || { echo "::error::.crate が 1 つも生成されていない"; exit 1; }
          echo "検査した package: $found"

  deny:
    name: cargo deny (license + advisories + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Run cargo deny
        run: cargo deny check all
